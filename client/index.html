<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Local WebRTC Call (XAMPP + Socket.IO)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 20px auto; padding: 0 12px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    video { width: 460px; max-width: 100%; background:#111; border-radius: 8px; }
    input, button { padding: 8px 10px; font-size: 14px; }
    #log { white-space: pre-wrap; background:#f5f5f5; padding:10px; border-radius:8px; min-height:120px; }
    #chatBox { height: 120px; overflow:auto; background:#f5f5f5; padding:10px; border-radius:8px; }
    .small { color:#444; font-size:12px; }
  </style>
</head>
<body>
  <h1>Local WebRTC Call</h1>
  <p class="small">
    使い方: Nodeシグナリング(server.js)を起動 → XAMPPでこのページを開く →
    別タブ/別ブラウザでもう一度開いて同じRoomにJoin → 片方でCall
  </p>

  <div class="row">
    <div>
      <div>Room</div>
      <input id="roomId" value="room1" />
    </div>
    <div>
      <div>Name</div>
      <input id="name" value="user" />
    </div>
    <div>
      <div>&nbsp;</div>
      <button id="joinBtn">Join</button>
      <button id="callBtn" disabled>Call</button>
      <button id="hangupBtn" disabled>Hangup</button>
    </div>
  </div>

  <hr />

  <div class="row">
    <div>
      <h3>Local</h3>
      <video id="localVideo" autoplay playsinline muted></video><br/>
      <button id="muteBtn" disabled>Mute</button>
      <button id="camBtn" disabled>Camera Off</button>
    </div>

    <div>
      <h3>Remote</h3>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <hr />

  <h3>Chat</h3>
  <div id="chatBox"></div>
  <div class="row">
    <input id="chatInput" placeholder="type message..." style="flex:1" />
    <button id="sendBtn" disabled>Send</button>
  </div>

  <hr />
  <h3>Log</h3>
  <div id="log"></div>

  <!-- Socket.IO client (CDN) -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="./client.js"></script>
</body>
</html>
